# Packs and publishes VpnHood.AppLib.Ios.StoreKitNative to nuget.org. Same pattern as the
# other VpnHood single-package repos (e.g. VpnHood.AppLib.Assets.IpLocations): every push to
# main bumps pub/PubVersion.json, stamps the csproj, commits the bump, packs, and pushes the
# package. Runs on windows-latest — the committed xcframework means packing net11.0-ios only
# needs the iOS workload, never a Mac.
name: Publish NuGet

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # OIDC token for nuget.org trusted publishing (NuGet/login)

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      BUILD_CONFIG: 'Release'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      CSPROJ: VpnHood.AppLib.Ios.StoreKitNative/VpnHood.AppLib.Ios.StoreKitNative.csproj

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Bump version and push
      if: github.event_name != 'pull_request'
      shell: pwsh
      run: |
        #1) Read PubVersion.json, increment build, and save
        $pubVersionFile = Join-Path $env:GITHUB_WORKSPACE 'pub/PubVersion.json'
        $pub = Get-Content $pubVersionFile -Raw | ConvertFrom-Json
        $v = [version]::Parse($pub.Version)
        $newV = [version]::new($v.Major, $v.Minor, ($v.Build + 1))
        $pub.Version = $newV.ToString(3)
        $pub | ConvertTo-Json -Depth 5 | Set-Content -Path $pubVersionFile -Encoding UTF8
        Write-Host "New version: $($pub.Version)"

        #2) Apply this version to the project file
        $proj = Join-Path $env:GITHUB_WORKSPACE $env:CSPROJ
        $xml = New-Object XML
        $xml.PreserveWhitespace = $true
        $xml.Load($proj)
        $versionNode = $xml.SelectSingleNode("Project/PropertyGroup/Version")
        if ($null -eq $versionNode) { throw "Version node not found in project file: $proj" }
        $versionNode.InnerText = $pub.Version
        $xml.Save($proj)

        #3) Commit and push using the version from PubVersion.json
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git commit -m "chore: bump version $($pub.Version)"
        git push

    # net11.0-ios needs the .NET 11 preview SDK; track the preview channel (matches the
    # monorepo's publish_nugets.yml) so each new preview is picked up automatically.
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '11.0'
        dotnet-quality: preview

    - name: Install .NET iOS workload
      run: dotnet workload install ios

    - name: Restore dependencies
      run: dotnet restore ${{ env.CSPROJ }}

    - name: Build
      run: dotnet build ${{ env.CSPROJ }} --no-restore --configuration ${{ env.BUILD_CONFIG }}

    - name: Pack
      run: dotnet pack ${{ env.CSPROJ }} --no-build --configuration ${{ env.BUILD_CONFIG }}

    # Trusted publishing: exchange the workflow's OIDC token for a short-lived nuget.org
    # API key (policy: vpnhood/VpnHood.AppLib.Ios.StoreKitNative + publish-nuget.yml). No
    # long-lived NUGET_API_KEY secret anywhere.
    - name: NuGet login (trusted publishing)
      if: github.event_name != 'pull_request'
      id: nuget_login
      uses: NuGet/login@v1
      with:
        user: ${{ vars.NUGET_USER }}

    - name: Publish
      if: github.event_name != 'pull_request'
      run: dotnet nuget push "**/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
